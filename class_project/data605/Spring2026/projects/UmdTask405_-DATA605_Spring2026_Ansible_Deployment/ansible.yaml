---
- name: Create a simple HTML webpage
  hosts: localhost
  connection: local

  tasks:
    - name: Create the HTML file
      copy:
        content: |
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>{{ page_title }}</title>
              <style>
                  body {
                      font-family: Arial, sans-serif;
                      max-width: 800px;
                      margin: 40px auto;
                      padding: 0 20px;
                      background: #f5f5f5;
                      color: #333;
                  }
                  h1 { color: #2c3e50; }
                  p  { line-height: 1.6; }
              </style>
          </head>
          <body>
              <h1>{{ page_title }}</h1>
              <p>Created by {{ author }}</p>
              <p>Generated on {{ ansible_date_time.date }}</p>
          </body>
          </html>
        dest: "{{ output_path }}"
        mode: "0644"