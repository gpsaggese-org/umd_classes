# .github/workflows/hello.yml

name: Hello World

on:
  push:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checking tree
        run: tree

      - name: Checking ls
        run: ls class_project/data605/Spring2026/projects/UmdTask405_-DATA605_Spring2026_Ansible_Deployment/

      - name: Install Ansible & lint
        run: pip install ansible ansible-lint

      - name: Run ansible-lint
        run: ansible-lint class_project/data605/Spring2026/projects/UmdTask405_-DATA605_Spring2026_Ansible_Deployment/ansible.yaml

      - name: Echo hello world
        run: echo "Hello, World!"

      - name: Create the HTML file
        copy:
          content: |
            <!DOCTYPE html>
            <html lang="en">
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>{{ page_title }}</title>
                <style>
                    body {
                        font-family: Arial, sans-serif;
                        max-width: 800px;
                        margin: 40px auto;
                        padding: 0 20px;
                        background: #f5f5f5;
                        color: #333;
                    }
                    h1 { color: #2c3e50; }
                    p  { line-height: 1.6; }
                </style>
            </head>
            <body>
                <h1>{{ page_title }}</h1>
                <p>Created by {{ author }}</p>
                <p>Generated on {{ ansible_date_time.date }}</p>
            </body>
            </html>
          dest: "{{ output_path }}"
          mode: "0644"

      - name: Confirm file was created
        debug:
          msg: "Webpage saved to {{ output_path }}"