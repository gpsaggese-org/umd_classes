  <!--
    Coordinate mapping from TikZ (cm) to SVG (px):
    scale = 50 px/cm, y flipped: svg_y = (630 + 35) - (tikz_y * 50)
    (extra 35px top margin added so the topmost question label isn't clipped)
    x: svg_x = tikz_x * 50
  -->
  <defs
     id="defs1">
    <marker
       id="arrowhead"
       markerWidth="10"
       markerHeight="10"
       refX="8"
       refY="3"
       orient="auto"
       markerUnits="strokeWidth">
      <path
         d="M0,0 L8,3 L0,6 Z"
         fill="#2d2d2d"
         id="path1" />
    </marker>
  </defs>
  <g
     transform="translate(0,11.75)"
     id="g7"
     style="display:inline">
    <!-- ============ Axes ============ -->
    <!-- Y axis: from (50, 630) up to (50, 70) with arrow -->
    <line
       x1="50"
       y1="615"
       x2="50"
       y2="45"
       stroke="#2d2d2d"
       stroke-width="1.2"
       marker-end="url(#arrowhead)"
       id="line1" />
    <!-- X axis: from (50, 630) to (1010, 630) with arrow -->
    <line
       x1="50"
       y1="615"
       x2="990"
       y2="615"
       stroke="#2d2d2d"
       stroke-width="1.2"
       marker-end="url(#arrowhead)"
